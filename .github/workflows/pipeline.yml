name: lead pipeline

# Sunday 14:00 UTC, the same slot the n8n schedule trigger used. While both
# implementations are running, this one is the second to touch the sheet, and
# the upsert on entry_id means that is a no-op rather than a duplicate.
on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and classify but write nothing"
        type: boolean
        default: false
      limit:
        description: "Stop after this many entries are classified"
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: run the pipeline
        env:
          WORDPRESS_ENTRIES_URL: ${{ vars.WORDPRESS_ENTRIES_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          REGISTRATION_FORM_ID: ${{ vars.REGISTRATION_FORM_ID }}
          CONTACT_US_FORM_ID: ${{ vars.CONTACT_US_FORM_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          python -m arthouse_ops \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.limit && format('--limit {0}', inputs.limit) || '' }}
